name: Publish Container Image

on:
  workflow_call:
    inputs:
      registry:
        description: Container registry hostname (defaults to ghcr.io).
        required: false
        type: string
      image_name:
        description: Image name to publish (defaults to the caller repository).
        required: false
        type: string
      context:
        description: Build context path.
        required: false
        type: string
      dockerfile:
        description: Containerfile/Dockerfile path.
        required: false
        type: string
      platforms:
        description: Target platforms (comma-separated).
        required: false
        type: string
      artifact_name:
        description: Optional build artifact produced by an earlier caller job.
        required: false
        type: string
        default: ''
      artifact_path:
        description: Directory to restore the artifact into before building.
        required: false
        type: string
        default: '.'
    secrets:
      REGISTRY_TOKEN:
        description: Optional registry token used instead of GITHUB_TOKEN.
        required: false
      REGISTRY_USERNAME:
        description: Optional registry username used instead of github.actor.
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.repository }}-${{ inputs.image_name || github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  IMAGE_NAME: ${{ inputs.image_name || github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Do not implicitly move :latest when a version tag is pushed.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context || './container' }}
          file: ${{ inputs.dockerfile || './container/containerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
